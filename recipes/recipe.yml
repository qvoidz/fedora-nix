---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-nix
description: Fedora atomic desktop with GNOME and the Nix package manager (NVIDIA 580 base).
base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

stages:
  # Rebuild glib2 with the nixpkgs glib-appinfo-watch patch in a separate
  # stage; resulting rpms are copied into the final image and installed.
  - name: glib2-build
    from: ghcr.io/blue-build/base-images/fedora-base-nvidia:latest
    modules:
      - type: files
        files:
          - source: patches
            destination: /tmp/patches
      - type: script
        scripts:
          - build-glib.sh

modules:
  # 1. System files (systemd units, tmpfiles.d, nix.conf)
  - type: files
    files:
      - source: system
        destination: /

  # 2. Install patched glib2 (overrides base package)
  - type: copy
    from: glib2-build
    src: /out/rpms/
    dest: /tmp/glib2-rpms/
  - type: script
    snippets:
      - dnf install -y /tmp/glib2-rpms/*.rpm && rm -rf /tmp/glib2-rpms

  # 3. GNOME desktop (explicit packages: the @gnome-desktop-environment
  #    group no longer exists in Fedora 45 comps; most infra is already in the base)
  - type: dnf
    install:
      packages:
        # Desktop core
        - gnome-shell
        - gdm
        - gnome-session
        - gnome-control-center
        - gnome-settings-daemon
        - gnome-backgrounds
        - adwaita-icon-theme
        - xdg-desktop-portal-gnome
        # Core apps
        - nautilus
        - ptyxis
        - gnome-text-editor
        - gnome-software
        - gnome-tweaks
        - gnome-calculator
        - gnome-system-monitor

  # 4. Nix (Fedora official package)
  - type: dnf
    install:
      packages:
        - nix

  # 5. systemd: enable gdm / NetworkManager / nix
  - type: systemd
    system:
      enabled:
        - gdm
        - NetworkManager
        - nix.mount
        - nix-daemon.service
      masked:
        - rpm-ostreed-automatic.timer

  # 6. Flatpak: enable Flathub by default, no bundled apps
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
      - scope: user

  - type: signing
